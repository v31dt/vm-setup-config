; ~/.config/polybar/config.ini
; Simple pentest-VM bar: workspaces | CPU MEM VOL VPN NET clock.
; Text labels only (no Nerd Font icons needed in the bar itself).

[colors]
background = #0b1220
foreground = #c7d0e0
accent     = #1793d1
muted      = #5a6578
alert      = #e06c75

[bar/main]
width = 100%
height = 26pt
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
padding-left = 1
padding-right = 2
module-margin = 1
font-0 = DejaVu Sans Mono:size=10;2
modules-left = i3
modules-right = cpu memory pulseaudio vpn net date
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = #0b1220
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = #0b1220
label-urgent-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
label = MEM %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
label-volume = VOL %percentage%%
label-muted = VOL mute
label-muted-foreground = ${colors.muted}

[module/net]
type = custom/script
exec = ~/.config/polybar/scripts/ip.sh
interval = 5

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn.sh
interval = 5
format-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %Y-%m-%d %H:%M
label = %date%

[settings]
screenchange-reload = true
